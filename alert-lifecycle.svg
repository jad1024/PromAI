<text x="1975" y="276" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">→ 移入历史</text>
<rect x="1755" y="400" width="200" height="44" rx="6" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
