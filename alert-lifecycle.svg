<line x1="140" y1="22" x2="156" y2="22" stroke="#9333ea" stroke-width="1.2" stroke-dasharray="4,3"/>
<text x="162" y="26" font-size="11" fill="#6b7280">旁路说明</text>
<rect x="228" y="16" width="10" height="10" rx="2" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1"/>
