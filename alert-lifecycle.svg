<text x="1855" y="436" text-anchor="middle" font-size="11" fill="#6b7280">相同 payload 30s 内跳过</text>
<path d="M 1820,290 L 1820,392" stroke="#9333ea" stroke-width="1.2" stroke-dasharray="4,3" fill="none" marker-end="url(#a-p)"/>
