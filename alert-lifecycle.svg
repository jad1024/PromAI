<text x="160" y="276" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">Server 启动</text>
<text x="160" y="305" text-anchor="middle" font-size="11" fill="#6b7280">加载规则/路由/通道配置</text>
