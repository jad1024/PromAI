<text x="1820" y="305" text-anchor="middle" font-size="11" fill="#6b7280">notified_count++</text>
<line x1="1885" y1="265" x2="1900" y2="265" stroke="#2563eb" stroke-width="1.5" marker-end="url(#a-b)"/>
<rect x="1915" y="240" width="120" height="50" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5" filter="url(#sd)"/>
