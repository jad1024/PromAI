<text x="1225" y="462" text-anchor="middle" font-size="10" fill="#94a3b8">next_notify_at 推进</text>
<rect x="1415" y="240" width="140" height="50" rx="6" fill="#fff" stroke="#d1d5db" stroke-width="1.5" filter="url(#sd)"/>
