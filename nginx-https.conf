# ============================================================
# PromAI Nginx HTTPS 安全部署模板
# 使用方法：
#   1. 将证书放到 /etc/nginx/ssl/（server.crt / server.key）
#   2. 将本文件替换 nginx.conf（或 include 进主配置）
#   3. nginx -t && nginx -s reload
# 说明：所有 /api/promai/reports/ 报告下载均已要求 JWT 鉴权，
#       前端通过带 Authorization 头的 blob 方式下载，无需放开 /reports/。
# ============================================================

# HTTP → HTTPS 强制跳转
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    # TLS 证书（替换为真实路径）
    ssl_certificate     /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;

    # TLS 安全配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    # HSTS：强制浏览器只走 HTTPS（有证书后建议开启）
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 通用安全响应头
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # CSP：按需调整；放开同源 API 与内联脚本（若前端使用非内联构建可进一步收紧）
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self' data:; object-src 'none'; frame-ancestors 'self'" always;

    client_max_body_size 50m;

    # 后端 API（含报告下载，均已由后端 JWT 鉴权）
    location /api/promai/ {
        proxy_pass http://promai:8091;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # 前端 SPA
    location /promai/ {
        alias /usr/share/nginx/html/promai/;
        try_files $uri $uri/ /promai/index.html;
    }

    # 根路径重定向到 /promai/
    location / {
        return 302 /promai/;
    }
}
